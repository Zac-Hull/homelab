groups:
  - name: homelab-availability
    rules:
      - alert: PrometheusTargetDown
        expr: up == 0
        for: 2m
        labels:
          severity: warning
          category: availability
        annotations:
          summary: "Prometheus target is down."
          description: "Target {{ $labels.instance }} for job {{ $labels.job }} has been down for more than 2 minutes."

      - alert: BlackboxProbeFailed
        expr: probe_success == 0
        for: 2m
        labels:
          severity: warning
          category: availability
        annotations:
          summary: "Blackbox probe failed."
          description: "Blackbox probe for {{ $labels.instance }} has failed for more than 2 minutes."

      - alert: AlertmanagerNotificationFailures
        expr: increase(alertmanger_notifications_failed_total[10m]) > 0
        for: 1m
        labels:
          severity: warning
          category: alerting
        annotations:
          summary: "Alertmanager notifications failure."
          description: "Alertmanager failed to send one or more notifications in the last 10 minutes."

      - alert: HostDiskUsageHigh
        expr: 100 - ((node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} * 100) / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"}) > 80
        for: 5m
        labels:
          severity: warning
          category: capacity
        annotations:
          summary: "Host disk usage is high."
          description: "{{ $labels.host }} disk usage is above 80% on mount {{ $labels.mountpoint }}."
