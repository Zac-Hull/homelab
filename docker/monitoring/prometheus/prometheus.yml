global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]
        labels:
          environment: "homelab"
          site: "home"
          host: "monitor01"
          role: "monitoring"

  - job_name: "node-exporter"
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/nodes.yml

  - job_name: "monitor01-cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          environment: "homelab"
          site: "home"
          host: "monitor01"
          role: "docker"
          exporter: "cadvisor"

  - job_name: "blackbox-http"
    metrics_path: /probe
    params:
      module: [http_2xx]
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/blackbox-http.yml
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: "alertmanager"
    static_configs:
      - targets: ["alertmanager:9093"]
        labels:
          environment: "homelab"
          site: "home"
          host: "monitor01"
          role: "alerting"
          exporter: "alertmanager"

  - job_name: "loki"
    static_configs:
      - targets: ["loki:3100"]
        labels:
          environment: "homelab"
          site: "home"
          host: "monitor01"
          role: "logging"
          component: "loki"

  - job_name: "alloy"
    static_configs:
      - targets: ["alloy:12345"]
        labels:
          environment: "homelab"
          site: "home"
          host: "monitor01"
          role: "log-collector"
          component: "alloy"
