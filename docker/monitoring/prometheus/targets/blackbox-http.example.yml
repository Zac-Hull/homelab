# Copy this file to blackbox-http.yml and replace placeholder values
# with real runtime targets. Do not commit blackbox-http.yml.

- targets:
    - "https://example.com"
  labels:
    environment: "production"
    site: "public"
    service: "portfolio-site"
    probe_type: "https"
    criticality: "high"

- targets:
    - "http://grafana:3000"
    - "http://prometheus:9090"
  labels:
    environment: "homelab"
    site: "home"
    service_group: "monitoring"
    probe_type: "http"
    criticality: "high"
