- targets:
    - "node-exporter:9100"
  labels:
    environment: "homelab"
    site: "home"
    host: "monitor01"
    role: "monitoring"
    exporter: "node"

- targets:
    - "<NODE_IP>:9100"
  labels:
    environment: "homelab"
    site: "home"
    host: "doc01"
    role: "documentation"
    exporter: "node"

- targets:
    - "<NODE_IP>:9100"
  labels:
    environment: "homelab"
    site: "home"
    host: "mbd01"
    role: "media backend"
    exporter: "node"
