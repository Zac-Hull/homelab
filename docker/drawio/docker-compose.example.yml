services:
  drawio:
    image: jgraph/drawio:30.0.4
    container_name: drawio
    restart: unless-stopped

    ports:
      - "$(DRAWIO_HTTP_PORT):8080"

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080 || exit 1"]
      interval: 1m30s
      timeout: 10s
      retries: 5
      start_period: 30s
